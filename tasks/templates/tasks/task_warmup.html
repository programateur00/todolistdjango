{% extends "tasks/base.html" %}
{% block title %}Calentamiento — {{ task.title }}{% endblock %}
{% block content %}

<header class="topbar">
    <div class="topbar__title">
        <span class="topbar__eyebrow">calentamiento</span>
        <h1>{{ task.title }}</h1>
    </div>
    <a href="{% url 'tasks:task_list' %}" class="stats-link">← Volver</a>
</header>

<div id="warmup-question">
    <p class="exercise-picker__hint">¿Ya has calentado?</p>
    <div class="task-form__actions">
        <button type="button" class="ghost-btn" id="warmup-no">No, quiero calentar</button>
        <form method="post" action="{% url 'tasks:task_warmup' task.pk %}?next={{ next|urlencode }}" style="display:contents">
            {% csrf_token %}
            <button type="submit" class="primary-btn">Sí, ya he calentado</button>
        </form>
    </div>
</div>

<div id="warmup-video" style="display:none">
    <p class="exercise-picker__hint">Este vídeo te iría bien.</p>
    <div class="video-embed" id="video-embed">
        <div id="video-player" class="video-embed__player"></div>
        <p class="field__hint" id="video-hint">Cargando…</p>
    </div>
    <form method="post" action="{% url 'tasks:task_warmup' task.pk %}?next={{ next|urlencode }}">
        {% csrf_token %}
        <div class="task-form__actions">
            <button type="submit" class="ghost-btn">Saltar y empezar ya</button>
            <button type="submit" class="primary-btn">Continuar al entreno</button>
        </div>
    </form>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
(function () {
    var questionEl = document.getElementById('warmup-question');
    var videoEl = document.getElementById('warmup-video');
    var hint = document.getElementById('video-hint');
    var videoId = "{{ video_id }}";
    var videoLoaded = false;

    document.getElementById('warmup-no').addEventListener('click', function () {
        questionEl.style.display = 'none';
        videoEl.style.display = '';
        if (!videoLoaded) {
            videoLoaded = true;
            loadVideo();
        }
    });

    function loadVideo() {
        window.onYouTubeIframeAPIReady = function () {
            hint.textContent = 'Míralo entero si quieres, o continúa cuando te apetezca — no hace falta verlo del todo.';
            new YT.Player('video-player', {
                videoId: videoId,
                playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1 },
                events: {
                    onStateChange: function (e) {
                        if (e.data === YT.PlayerState.ENDED) hint.textContent = 'Listo.';
                    },
                    onError: function () {
                        hint.textContent = 'Este vídeo no se pudo cargar — no pasa nada, puedes continuar igual.';
                    },
                },
            });
        };
        if (window.YT && window.YT.Player) window.onYouTubeIframeAPIReady();
    }
})();
</script>
{% endblock %}
