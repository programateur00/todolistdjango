{% extends "tasks/base.html" %}
{% block title %}Calentamiento — {{ task.title }}{% endblock %}
{% block content %}

<header class="topbar">
    <div class="topbar__title">
        <span class="topbar__eyebrow">calentamiento</span>
        <h1>{{ task.title }}</h1>
    </div>
    <a href="{% url 'tasks:task_list' %}" class="stats-link">← Volver</a>
</header>

<p class="exercise-picker__hint">
    Antes de entrenar, un calentamiento rápido — mira el vídeo entero para poder continuar.
</p>

<div class="video-embed" id="video-embed">
    <div id="video-player" class="video-embed__player"></div>
    <p class="field__hint" id="video-hint">Cargando…</p>
</div>

<form method="post" action="{% url 'tasks:task_warmup' task.pk %}?next={{ next|urlencode }}">
    {% csrf_token %}
    <div class="task-form__actions">
        <button type="submit" class="primary-btn" id="continue-btn" disabled>Continuar al entreno</button>
    </div>
</form>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
(function () {
    var hint = document.getElementById('video-hint');
    var continueBtn = document.getElementById('continue-btn');
    var videoId = "{{ video_id }}";
    var player = null;

    window.onYouTubeIframeAPIReady = function () {
        hint.textContent = 'Mira el vídeo entero — el botón se activa al terminar.';
        player = new YT.Player('video-player', {
            videoId: videoId,
            playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1 },
            events: {
                onStateChange: function (e) {
                    if (e.data === YT.PlayerState.ENDED) {
                        hint.textContent = 'Ya has calentado — puedes continuar.';
                        continueBtn.disabled = false;
                    }
                },
                onError: function () {
                    hint.textContent = 'Este vídeo no se pudo cargar — recarga la página para reintentarlo.';
                },
            },
        });
    };
    if (window.YT && window.YT.Player) window.onYouTubeIframeAPIReady();
})();
</script>
{% endblock %}
