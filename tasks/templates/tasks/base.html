{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light" id="color-scheme-meta">
    <title>{% block title %}Strive{% endblock %}</title>
    <meta name="theme-color" content="#171310" id="theme-color-meta">
    <script>
        // Se fija ANTES de que cargue el CSS/pinte nada, para no ver un
        // parpadeo del tema equivocado un instante al cargar la página.
        // Preferencia del propio navegador (localStorage), no del servidor.
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('color-scheme-meta')?.setAttribute('content', 'light');
                document.getElementById('theme-color-meta')?.setAttribute('content', '#F1E0BE');
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <nav class="site-nav">
        <div class="site-nav__inner">
            <a href="{% url 'tasks:task_list' %}" class="site-nav__brand">STRIVE</a>
            <div class="site-nav__links">
                <a href="{% url 'tasks:task_list' %}" class="{% if request.resolver_match.url_name == 'task_list' %}is-active{% endif %}">Tareas</a>
                <a href="{% url 'tasks:plan_list' %}" class="{% if '/planes' in request.path %}is-active{% endif %}">Planes</a>
                <a href="{% url 'tasks:weekly_review' %}" class="{% if request.resolver_match.url_name == 'weekly_review' %}is-active{% endif %}">Revisión</a>
                <a href="{% url 'tasks:stats_list' %}" class="{% if '/estadisticas' in request.path %}is-active{% endif %}">Estadísticas</a>
                <button type="button" class="theme-toggle" id="theme-toggle" title="Cambiar a modo claro/oscuro" aria-label="Cambiar de tema">🌙</button>
            </div>
        </div>
    </nav>
    <div class="page">{% block content %}{% endblock %}</div>
    <p class="credits">
        Ilustraciones de ejercicios: <strong>Everkinetic</strong> (CC BY-SA 3.0).
    </p>
    <script>
        (function () {
            var btn = document.getElementById('theme-toggle');
            var metaTag = document.getElementById('color-scheme-meta');
            var themeColorTag = document.getElementById('theme-color-meta');
            function isLight() { return document.documentElement.getAttribute('data-theme') === 'light'; }
            function updateIcon() { btn.textContent = isLight() ? '☀️' : '🌙'; }
            updateIcon();
            btn.addEventListener('click', function () {
                var next = isLight() ? 'dark' : 'light';
                if (next === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
                metaTag?.setAttribute('content', next);
                themeColorTag?.setAttribute('content', next === 'light' ? '#F1E0BE' : '#171310');
                localStorage.setItem('theme', next);
                updateIcon();
            });
        })();
    </script>
</body>
</html>
