{% extends "tasks/base.html" %}
{% block title %}Ajustes — Libreta{% endblock %}
{% block content %}

<header class="topbar">
    <div class="topbar__title">
        <span class="topbar__eyebrow">tú</span>
        <h1>Ajustes</h1>
    </div>
</header>

<form class="task-form" method="post">
    {% csrf_token %}
    <label class="field">
        <span class="field__label">Mi peso (kg)</span>
        <input type="number" name="body_weight_kg" min="30" max="300" step="0.1"
               inputmode="decimal" placeholder="{{ default_weight_kg }}" value="{{ body_weight_kg }}">
        <span class="field__hint">
            Se usa para estimar las calorías de cada ejercicio (MET × peso × tiempo). Es una
            aproximación, no una medición. Vacío = {{ default_weight_kg }} kg por defecto.
            Cada sesión guarda las calorías con el peso de ese momento.
        </span>
    </label>
    <div class="task-form__actions">
        <button type="submit" class="primary-btn">Guardar</button>
    </div>
</form>

{% endblock %}
