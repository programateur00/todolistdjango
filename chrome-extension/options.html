<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Libreta — Tiempo en Udemy</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 24px auto; color: #2a2015; background: #faf6ee; }
  h1 { font-size: 16px; margin-bottom: 4px; }
  p.hint { font-size: 12px; color: #7a6f5c; margin-top: 0; }
  label { display: block; margin-top: 14px; font-size: 13px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; border: 1px solid #d8cdb8; border-radius: 6px; font-size: 14px; }
  .actions { margin-top: 18px; display: flex; gap: 8px; }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid #d69e2e; background: #d69e2e; color: #2a2015; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: #2a2015; }
  #status { margin-top: 14px; font-size: 13px; white-space: pre-wrap; }
  #status.ok { color: #2f7a3d; }
  #status.error { color: #b3261e; }
</style>
</head>
<body>
  <h1>Libreta — Tiempo en Udemy</h1>
  <p class="hint">Los mismos datos que usas en la app móvil (usuario/contraseña del candado de la web).</p>

  <label for="baseUrl">URL de tu Libreta</label>
  <input id="baseUrl" type="text" placeholder="https://tuusuario.pythonanywhere.com">

  <label for="user">Usuario</label>
  <input id="user" type="text" autocomplete="username">

  <label for="password">Contraseña</label>
  <input id="password" type="password" autocomplete="current-password">

  <div class="actions">
    <button id="save">Guardar</button>
    <button id="test" class="secondary" type="button">Probar conexión</button>
  </div>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
